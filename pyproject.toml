[project]
name = "dc-bot"
version = "0.2.0"
description = "Discord bot driven by Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0.0",
    "discord.py>=2.4.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
    "claude-agent-sdk>=0.1.0",
    "aiosqlite>=0.20.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
